[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolab-rag"
version = "0.1.0"
description = "Unit-normalized lab trend summaries with evidence-grounded explanations and deterministic safety checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "chronolab-rag contributors" }]
keywords = ["loinc", "fhir", "laboratory", "trends", "rag"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
chronolab = "chronolab_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronolab_rag = ["py.typed", "retrieval/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
